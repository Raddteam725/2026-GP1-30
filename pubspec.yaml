name: radd
description: Radd Android application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  camera: ^0.12.1
  http: ^1.6.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.3
  intl: any
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/volunteer/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
