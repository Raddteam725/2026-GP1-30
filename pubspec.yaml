name: radd
description: Radd Android application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
